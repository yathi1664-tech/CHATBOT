<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1020">
  <title>Private Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="loginScreen" class="login-screen">
      <div class="login-card">
        <div class="logo">🔐</div>
        <p class="eyebrow">INVITE-ONLY CHAT</p>
        <h1>Private Room</h1>
        <p class="subtitle">Enter the shared password to continue.</p>
        <form id="loginForm">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="Enter password" required>
            <button id="showPassword" class="icon-btn" type="button" aria-label="Show password">👁</button>
          </div>
          <p id="loginError" class="error" aria-live="polite"></p>
          <button class="primary-btn" type="submit">Enter room</button>
        </form>
      </div>
    </section>

    <section id="chatScreen" class="chat-screen hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">PASSWORD PROTECTED</p>
          <h2>Private Room</h2>
          <div class="presence"><span class="status-dot"></span><span id="presenceText">Connecting…</span></div>
        </div>
        <div class="top-actions">
          <button id="audioCallBtn" class="call-btn" type="button" title="Audio call">📞</button>
          <button id="videoCallBtn" class="call-btn" type="button" title="Video call">🎥</button>
          <button id="logoutBtn" class="leave-btn" type="button">Leave</button>
        </div>
      </header>

      <div class="name-row">
        <label for="displayName">Your name</label>
        <input id="displayName" maxlength="24" placeholder="Guest">
      </div>

      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="typingIndicator" class="typing-indicator"></div>

      <form id="messageForm" class="composer">
        <input id="fileInput" type="file" hidden accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip">
        <button id="attachBtn" class="composer-btn" type="button" aria-label="Attach file">📎</button>
        <button id="emojiBtn" class="composer-btn" type="button" aria-label="Emoji">😊</button>
        <div id="emojiPanel" class="emoji-panel hidden"></div>
        <textarea id="messageInput" rows="1" maxlength="1200" placeholder="Type a message…"></textarea>
        <button id="recordBtn" class="composer-btn" type="button" aria-label="Record voice message">🎙️</button>
        <button class="send-btn" type="submit" aria-label="Send">➤</button>
      </form>
      <div id="uploadStatus" class="upload-status hidden"></div>
    </section>

    <div id="callPanel" class="call-panel hidden">
      <div class="call-card">
        <p id="callStatus" class="call-status">Calling…</p>
        <div class="video-stage">
          <video id="remoteVideo" autoplay playsinline></video>
          <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div class="call-controls">
          <button id="muteBtn" type="button">🎙️</button>
          <button id="cameraBtn" type="button">📷</button>
          <button id="endCallBtn" class="end-call" type="button">✕</button>
        </div>
      </div>
    </div>

    <div id="incomingCall" class="incoming-call hidden">
      <div class="incoming-card">
        <h3 id="incomingTitle">Incoming call</h3>
        <p id="incomingFrom">Someone is calling…</p>
        <div>
          <button id="declineCallBtn" class="decline-btn" type="button">Decline</button>
          <button id="acceptCallBtn" class="accept-btn" type="button">Accept</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
